[project]
name = "outbox"
version = "0.1.0"
description = "A Relay-compatible outbox for testing email flows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
outbox = "outbox:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
